<!-- um formulário interativo completo contendo validações nativas e máscaras de entrada rigorosas -->

<!-- criar um formulário de cadastro (Nome completo, e-mail, data de nascimento, endereço, cidade e estado, entre outros)
e seus  atributo de tipo (type) e de identificação correspondam perfeitamente à natureza da informação esperada.-->
<!DOCTYPE html>
<html lang="pt-BR">
<head> 
    <meta charset="UTF-8">
    <title> formulário de cadastro.</title>
    <link rel="stylesheet" href="../css/main.css">
</head>

<body>
<template id="template-cadastro">
    <h1> Formulário de cadastro </h1>
    <form>

        <fieldset>
            <legend> Dados de cadastro. </legend>

            <label for="nome">Nome Completo.</label>
            <input type="text" id="nome" name="nome" placeholder="digite seu nome" title="formato:João Alves" autocomplete="name" required>
        
            <label for="email">E-mail.</label>
            <input type="email" id="email" name="email" placeholder="exemplo@exemplo.com" title="exemplo@exemplo.com" autocomplete="email" required>

            <labeL for="datansc">Data de Nascimento.</labeL>
            <input type="date" id="datansc" name="idade" title="00/00/00" autocomplete="bday" required>

            <label for="cpf"> CPF </label>
            <input type="text" id="cpf" name="cpf" maxlength="14" pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}" 
            placeholder="000.000.000-00" title="Formato: 000.000.000-00" required>
            
            <label for="celular"> número de celular.</label>
            <input type="tel" id="celular" name="celular" maxlength="20" pattern="[1-9]{2} [0-9]{5}-[0-9]{4}" 
            placeholder="00 1234 6789" title="Formato:00 00000 0000" autocomplete="tel" title="Formato: 00 00000-0000" required>
        </fieldset>

        <fieldset>
            <legend> Informações de Endereço .</legend>
            <label for="cep"> CEP.</label>
            <input type="text" id="cep" name="CEP" maxlength="9" pattern="[0-9]{5}-[0-9]{3}" 
            placeholder="00000-000" title="Formato: 00000-000" autocomplete="postal-code" required> 
    >
            <label for="endereco"> Endereço.</label>
            <input type="text" id="endereco" name="endereço">

            <label for="numerocasa">Número da casa ou apartamento.</label>
            <input type="number" id="numerocasa" name="numero">

            <label for="cidade">Cidade.</label>
            <input type="text" id="cidade" name="cidade" required>

            <label for="estado">Estado.</label>
            <input type="text" id="estado" name="sigla" maxlength="2" placeholder="  " required>
        </fieldset>    
            <button type="submit"> enviar cadastro </button>

            <div class="toast" role="status">
                Cadastro enviado com sucesso!
            </div>
            
       
    </form>
</template>

</body>   
</html>
